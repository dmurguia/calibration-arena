name: Daily benchmark snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
    - cron: '47 1,7,19 * * *'

permissions:
  contents: read

concurrency:
  group: benchmark-publication
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'dmurguia/calibration-arena' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 13 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-benchmarks.txt
          npm ci --prefix frontend
      - name: Test importers and frontend
        run: |
          cd backend
          python -m pytest tests/test_boards.py tests/test_benchmarks.py tests/test_benchmark_refresh.py -q
          cd ../frontend
          node --experimental-strip-types --test tests/benchmarkFreshness.test.ts
          npm run build
      - name: Load last published snapshot
        run: |
          mkdir -p previous
          status=$(curl --silent --show-error --location --output previous/benchmarks.json --write-out '%{http_code}' https://raw.githubusercontent.com/dmurguia/calibration-arena/benchmark-data/benchmarks.json)
          if [ "$status" = '404' ]; then rm previous/benchmarks.json; elif [ "$status" != '200' ]; then exit 1; fi
      - name: Fetch and validate independent sources
        run: |
          previous_args=()
          if [ -f previous/benchmarks.json ]; then previous_args=(--previous "$PWD/previous"); fi
          PYTHONPATH=backend python -m pipeline.refresh_benchmarks --output publication --evidence evidence "${previous_args[@]}"
      - name: Publish atomic snapshot commit
        run: PYTHONPATH=backend python -m pipeline.publish_benchmarks publication --repository "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify public feed delivery
        run: PYTHONPATH=backend python -m pipeline.verify_benchmarks --expected publication/benchmarks.json --publication-only --wait-seconds 600
      - name: Verify rendered public boards
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test tests/daily-snapshot.spec.ts --workers=1 --timeout=120000
        env:
          EXPECTED_SNAPSHOT: ../publication/benchmarks.json
      - name: Alert on failed or overdue sources
        if: always() && hashFiles('publication/benchmarks.json') != ''
        run: PYTHONPATH=backend python -m pipeline.verify_benchmarks --expected publication/benchmarks.json
      - name: Save source evidence and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            frontend/test-results/
          retention-days: 14

  watchdog:
    if: github.repository == 'dmurguia/calibration-arena' && github.event_name == 'schedule' && github.event.schedule != '17 13 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-benchmarks.txt
      - name: Detect missed runs and stale sources
        run: PYTHONPATH=backend python -m pipeline.verify_benchmarks
