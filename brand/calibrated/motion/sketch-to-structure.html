 const W=tmp.width,H=tmp.height,d=gc.getImageData(0,0,W,H).data,m=new Uint8Array(W*H);
 for(let i=0;i<m.length;i++)m[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3<threshold?1:0;
 // Thin the actual graphite into connected centerlines; retain lines, never point particles.
 const off=[-W,-W+1,1,W+1,W,W-1,-1,-W-1];
 for(let it=0;it<18;it++){let changed=0;
  for(let pass=0;pass<2;pass++){const remove=[];
   for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;if(!m[i])continue;
    const p=off.map(o=>m[i+o]);let n=0,a=0;for(let k=0;k<8;k++){n+=p[k];if(!p[k]&&p[(k+1)%8])a++;}
    if(n<2||n>6||a!==1)continue;
    if(pass===0?(p[0]*p[2]*p[4]===0&&p[2]*p[4]*p[6]===0):(p[0]*p[2]*p[6]===0&&p[0]*p[4]*p[6]===0))remove.push(i);
   }for(const i of remove)m[i]=0;changed+=remove.length;
  }if(!changed)break;
 }
 const seen=new Uint8Array(m.length),paths=[];
 const neighbors=i=>off.map(o=>i+o).filter(j=>j>=0&&j<m.length&&m[j]&&!seen[j]&&Math.abs(j%W-i%W)<2);
 const seeds=[];for(let i=W+1;i<m.length-W-1;i++)if(m[i]&&neighbors(i).length===1)seeds.push(i);
 for(let i=W+1;i<m.length-W-1;i++)if(m[i])seeds.push(i);
 for(const start of seeds){if(seen[start])continue;const path=[];let i=start,dx=0,dy=0;
  for(let j=0;j<500;j++){seen[i]=1;path.push({x:(i%W)/scale,y:Math.floor(i/W)/scale});const ns=neighbors(i);if(!ns.length)break;
   ns.sort((a,b)=>{const score=n=>((n%W-i%W)*dx+(Math.floor(n/W)-Math.floor(i/W))*dy)/Math.hypot(n%W-i%W,Math.floor(n/W)-Math.floor(i/W));return score(b)-score(a)});
   const next=ns[0];dx=next%W-i%W;dy=Math.floor(next/W)-Math.floor(i/W);i=next;
  }if(path.length>=minimum)paths.push(path);
 }
 return paths.sort((a,b)=>a[0].y-b[0].y||a[0].x-b[0].x);
}
function resample(path){const lengths=[0];for(let i=1;i<path.length;i++)lengths.push(lengths[i-1]+Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y));
 const total=lengths[lengths.length-1],out=[];let k=1;for(let j=0;j<28;j++){const t=total*j/27;while(k<lengths.length-1&&lengths[k]<t)k++;const q=(t-lengths[k-1])/(lengths[k]-lengths[k-1]||1);out.push({x:lerp(path[k-1].x,path[k].x,q),y:lerp(path[k-1].y,path[k].y,q)});}return out;
}
function rebuild(){
 drawLogo();if(!source.complete||!source.naturalWidth)return;
 const b=canvas.getBoundingClientRect();width=b.width;height=b.height;if(!width||!height)return;
 const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0);
 sketchCanvas=document.createElement('canvas');sketchCanvas.width=Math.round(width);sketchCanvas.height=Math.round(height);
 const s=sketchCanvas.getContext('2d');s.fillStyle='#f4f1e9';s.fillRect(0,0,width,height);
 const scale=Math.max(width/source.naturalWidth,height/source.naturalHeight),iw=source.naturalWidth*scale,ih=source.naturalHeight*scale;
 s.drawImage(source,(width-iw)/2,(height-ih)/2,iw,ih);
 codeCanvas=document.createElement('canvas');codeCanvas.width=Math.round(width);codeCanvas.height=Math.round(height);
 const c=codeCanvas.getContext('2d');const small=width<460;
 const fs=small?12:Math.min(16,width/32),line=small?24:27;
 const lines=small?['note = observe(world)','draft = sketch(note)','','while learning:','  draft = agent.refine(','    draft, feedback','  )','  feedback = human(', '    review(draft)','  )']:['observation = observe(world)','hypothesis = sketch(observation)','','while learning:','    proposal = agent.refine(hypothesis)','    feedback = human.review(proposal)','    hypothesis = revise(proposal, feedback)','','# observe / draw / test / refine'];
 c.font=fs+'px "IBM Plex Mono", monospace';c.fillStyle='#464643';
 const left=(width-(small?23:43)*fs*.6)/2,top=(height-lines.length*line)/2+fs;
 lines.forEach((str,i)=>c.fillText(str,left,top+i*line));
 seed=593;const start=getPaths(sketchCanvas,157,12),end=getPaths(codeCanvas,195,3);
 const n=Math.min(850,start.length);segments=[];target=[];
 for(let i=0;i<n;i++){
  const a=start[Math.floor(i*start.length/n)],z=end[Math.floor(i*end.length/n)];
  segments.push({path:resample(a),weight:.5+rand()*.7,delay:rand()*.1,arc:(rand()-.5)*height*.13});target.push(resample(z));
 }
 ready=true;draw();
}
function draw(){
 if(!ready)return;
 const p=phase;ctx.globalAlpha=1;ctx.fillStyle='#f4f1e9';ctx.fillRect(0,0,width,height);
 if(p<.55){ctx.globalAlpha=1-smooth((p-.15)/.40);ctx.drawImage(sketchCanvas,0,0,width,height);}
 else if(options.trace&&p>.86){ctx.globalAlpha=.045*smooth((p-.86)/.14);ctx.drawImage(sketchCanvas,0,0,width,height);}
 const visibility=smooth((p-.08)/.17)*(1-smooth((p-.91)/.09));
 if(visibility>.001){
  ctx.strokeStyle='#535350';ctx.lineCap='round';
  for(let i=0;i<segments.length;i++){
   const a=segments[i],b=target[i],q=smooth((p-.16-a.delay)/(.72-a.delay));
   ctx.globalAlpha=visibility*(.42+a.weight*.24);ctx.lineWidth=lerp(a.weight,.75,q);
   ctx.beginPath();for(let j=0;j<a.path.length;j++){
    const x=lerp(a.path[j].x,b[j].x,q),y=lerp(a.path[j].y,b[j].y,q)+Math.sin(q*Math.PI)*a.arc;
    if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }ctx.stroke();
  }
 }
 if(p>.76){ctx.globalAlpha=smooth((p-.76)/.21)*.92;ctx.drawImage(codeCanvas,0,0,width,height);}
 ctx.globalAlpha=1;
 slider.value=Math.round(p*1000);root.dataset.phase=p.toFixed(3);
 label.textContent=p<.2?'Graphite / open gesture':p<.52?'Gathering strokes':p<.85?'Finding syntax':'Agent / human / revision';
}
function sync(){button.textContent=running?'Pause':'Play';button.setAttribute('aria-label',running?'Pause brand animation':'Play brand animation')}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{study:'Open sketch to structure',phase,playing:running},privateContent:{phase,playing:running}}).catch(()=>{})}
function restore(state,initial=false){const s=state?.privateContent;if(!s)return;if(typeof s.phase==='number'){phase=Math.max(0,Math.min(1,s.phase));clock=phase*options.duration/2}if(typeof s.playing==='boolean')running=s.playing&&(!initial||!reduced.matches);sync();draw()}
button.addEventListener('click',()=>{running=!running;last=0;sync();save()});
slider.addEventListener('input',()=>{phase=Number(slider.value)/1000;clock=phase*options.duration/2;running=false;sync();draw()});
slider.addEventListener('change',()=>{root.querySelector('.sr').textContent=label.textContent;save()});
window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
reduced.addEventListener('change',()=>{if(reduced.matches){running=false;sync()}});
document.addEventListener('visibilitychange',()=>{visible=!document.hidden;last=0});
function tick(t){
 if(running&&visible&&ready){if(last){clock+=(t-last)/1000;const k=(clock%options.duration)/options.duration;phase=k<.5?k*2:2-k*2;if(++frame%2===0)draw()}last=t}else last=0;
 if(root.isConnected)requestAnimationFrame(tick);
}
document.fonts.ready.then(rebuild);
source.addEventListener('load',rebuild);new ResizeObserver(rebuild).observe(canvas);
sync();restore(window.openai?.widgetState,true);rebuild();requestAnimationFrame(tick);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:draw});tweak.addSlider(options,'duration',{label:'Cycle length',min:16,max:36,unit:'s'});tweak.addToggle(options,'trace',{label:'Retain a trace of the drawing'})}
})();
</script>
